<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110d0a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Leonardo's D&D companion</title>
<style>
:root{
  --ink:#efe4cf; --muted:#a99c89; --gold:#c69a52; --gold2:#e3bd79;
  --bg:#100d0b; --panel:#18130f; --panel2:#211a14; --line:#443626;
  --red:#8f463c; --green:#6f8c68; --shadow:0 18px 60px rgba(0,0,0,.35);
  --cat-accent:#7d9a6d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 15% 0%,rgba(118,83,42,.16),transparent 28%),
 radial-gradient(circle at 90% 15%,rgba(86,38,29,.13),transparent 26%),
 repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px),
 var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}
.sidebar{padding:22px 17px;border-right:1px solid var(--line);background:
 linear-gradient(180deg,rgba(35,26,19,.98),rgba(20,16,13,.98));position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:Georgia,serif;font-weight:800;letter-spacing:.08em;font-size:17px;color:#f3dfb9}
.brand:before{content:"◆";font-size:10px;color:var(--gold);margin-right:8px}
.brand small{display:block;margin:7px 0 0 18px;color:var(--muted);font:500 11px/1.4 Inter,system-ui;letter-spacing:.08em;text-transform:uppercase}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:18px 0}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#8e806e;margin:23px 10px 9px}
.category{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:#cfc2ae;padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left;position:relative}
.category:hover{background:#211a14;border-color:#382c21}
.category.active{background:linear-gradient(90deg,rgba(198,154,82,.12),rgba(198,154,82,.03));color:#fff0d0;border-color:#54412c}
.category.active:before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;background:var(--cat-accent);border-radius:4px}
.category .count{margin-left:auto;font-size:10px;color:#7e7262}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.side-actions button,.quick button{border:1px solid var(--line);background:#1a1511;color:#cdbfa9;padding:8px;border-radius:8px;cursor:pointer;font-size:11px}
.side-actions button:hover,.quick button:hover{border-color:#6a5133;color:white}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.main{padding:27px 30px 170px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.title h1{margin:0;font:700 32px/1.05 Georgia,serif;color:#f4e6cc}
.title p{margin:8px 0 0;color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconbtn,.textbtn{border:1px solid var(--line);background:#1b1511;color:#d5c5ac;border-radius:9px;padding:9px 11px;cursor:pointer}
.iconbtn:hover,.textbtn:hover{border-color:#755a37;color:white}
.textbtn:disabled,.iconbtn:disabled,.primarybtn:disabled,.secondarybtn:disabled{
 opacity:.55;cursor:not-allowed;filter:saturate(.55)
}
.sync-state{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#777}
.sync-dot.clean{background:#6f9b6e}.sync-dot.dirty{background:#c69a52}.sync-dot.conflict{background:#b85e53}
.searchbar{display:flex;gap:9px;margin:18px 0}
.searchbar input{flex:1;min-width:0;background:#17120f;border:1px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:9px;outline:none}
.searchbar input:focus{border-color:#755a37}
.filter{background:#17120f;border:1px solid var(--line);color:var(--ink);padding:0 10px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px}
.track{background:
 linear-gradient(180deg,rgba(38,29,22,.95),rgba(25,20,16,.98));
 border:1px solid #3c2f24;border-radius:12px;padding:16px;transition:.16s ease;cursor:pointer;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.track:hover{transform:translateY(-2px);border-color:#6c5234}
.track.playing{border-color:var(--cat-accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--cat-accent) 35%,transparent),var(--shadow)}
.track .seal{position:absolute;right:12px;top:12px;font-size:15px;opacity:.45}
.track.favorite .seal{opacity:1;color:var(--gold2)}
.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.17em;color:var(--cat-accent);margin-bottom:10px}
.track h3{margin:0 28px 7px 0;font:700 17px/1.25 Georgia,serif;color:#f1e2c8}
.track p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:8px}
.play{border:1px solid #71542f;background:linear-gradient(#d1a65f,#b9853d);color:#1d140b;padding:8px 11px;border-radius:8px;font-weight:850;cursor:pointer}
.open{color:#a89b87;text-decoration:none;font-size:11px}.open:hover{color:white}
.empty{border:1px dashed #47382a;padding:46px 20px;text-align:center;border-radius:12px;color:#8f826f}
.now{position:fixed;left:255px;right:0;bottom:0;border-top:1px solid #4a3928;background:rgba(19,15,12,.97);backdrop-filter:blur(18px);padding:13px 24px;z-index:30;padding-bottom:max(13px,env(safe-area-inset-bottom))}
.nowrow{display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(260px,1fr);align-items:center;gap:22px}
.np small{display:block;color:#8d806e;font-size:9px;text-transform:uppercase;letter-spacing:.16em}.np strong{display:block;margin-top:5px;font-family:Georgia,serif}.np span{color:var(--muted);font-size:11px}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:#857968;margin-top:5px}.dot{width:6px;height:6px;border-radius:50%;background:#6d665d}.dot.ready{background:#7da276}.dot.fading{background:#d0a154}.dot.error{background:#b45b4e}
.transport{display:flex;align-items:center;gap:7px}.transport button{height:38px;min-width:42px;border-radius:8px;border:1px solid var(--line);background:#211a14;color:#e5d5bb;cursor:pointer}.transport button.primary{background:linear-gradient(#d1a65f,#b9853d);color:#1d140b;border-color:#8e6939;font-weight:900}
.master{display:flex;justify-content:flex-end;align-items:center;gap:9px;color:#978a76;font-size:11px}.master input{width:170px;accent-color:var(--gold)}
.audio-chip{border:1px solid #665035;background:#21190f;color:#d4b97d;padding:5px 8px;border-radius:999px;font-size:10px;cursor:pointer;margin-left:7px}
.audio-chip.ready{border-color:#415941;color:#96b98f;background:#131a13}
.modalback{position:fixed;inset:0;background:rgba(3,2,2,.72);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(720px,100%);max-height:min(820px,92vh);overflow:auto;background:
 linear-gradient(180deg,#211912,#17120e);border:1px solid #60482d;border-radius:14px;box-shadow:0 28px 90px rgba(0,0,0,.65)}
.modalhead{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;border-bottom:1px solid #3b2e23}.modalhead h2{margin:0;font:700 21px Georgia,serif;color:#f0dfc0}.close{border:0;background:transparent;color:#b4a58f;font-size:22px;cursor:pointer}
.modalbody{padding:18px 19px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#9d8e79}.field input,.field select,.field textarea{width:100%;background:#120f0c;border:1px solid #46372a;color:#eee0c9;border-radius:8px;padding:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#82623b}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding:15px 19px;border-top:1px solid #3b2e23}.primarybtn{background:linear-gradient(#d1a65f,#b9853d);border:1px solid #8e6939;color:#1b1209;padding:9px 13px;border-radius:8px;font-weight:850;cursor:pointer}.secondarybtn{background:#201912;border:1px solid #4a392a;color:#d6c6ad;padding:9px 13px;border-radius:8px;cursor:pointer}.dangerbtn{background:#2a1715;border:1px solid #6f3933;color:#e0a59f;padding:9px 13px;border-radius:8px;cursor:pointer}
.library-list{display:flex;flex-direction:column;gap:8px}.edititem{display:flex;align-items:center;gap:9px;border:1px solid #3f3125;background:#17120f;padding:10px;border-radius:9px}.edititem .grow{flex:1;min-width:0}.edititem strong{font-family:Georgia,serif}.edititem small{display:block;color:#8e806c;margin-top:3px}.mini{border:1px solid #46372a;background:#211912;color:#c8b89f;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid #3a2d22;padding-bottom:9px}.tabs button{border:0;background:transparent;color:#998a74;padding:7px 9px;cursor:pointer}.tabs button.active{color:#f1dfbf;border-bottom:2px solid var(--gold)}
.notice{font-size:12px;color:#a79883;line-height:1.5;padding:10px 12px;border:1px solid #3d3025;background:#14100d;border-radius:8px;margin-bottom:12px}
.import-progress{font-size:12px;color:#cdbb9e;margin-top:10px}.helper-player{width:320px;height:200px;max-width:100%;margin-top:12px;background:#000}
.pinbox{text-align:center;padding:12px 0}.pinbox input{font-size:25px;letter-spacing:.35em;text-align:center;width:180px}
.debug{margin-top:20px;border:1px solid #362a20;border-radius:10px;overflow:hidden;background:#090807}.debug summary{cursor:pointer;padding:10px 12px;color:#756b5f;font-size:10px}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.playerbox{min-height:200px;overflow:hidden;border-radius:7px;background:#000}.playerbox iframe{width:100%;height:200px}
@media(max-width:880px){
 .app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}.brand small{display:inline;margin-left:8px}.section-label{margin-top:15px}.sidebar #categories{display:flex;overflow:auto;gap:6px;padding-bottom:4px}.category{min-width:max-content;width:auto}.side-actions{display:none}.quick{grid-template-columns:repeat(4,minmax(80px,1fr));overflow:auto}
 .main{padding:20px 14px 190px}.now{left:0}.nowrow{grid-template-columns:1fr}.master{justify-content:flex-start}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.sync-state{margin-left:auto}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.players{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Leonardo's D&D companion<small>Codex Sonorum · v0.4.4</small></div>
  <div class="rule"></div>
  <div class="section-label">Escenas</div>
  <div id="categories"></div>
  <div class="section-label edit-only hidden">Biblioteca</div>
  <div class="side-actions edit-only hidden">
    <button onclick="openLibrary()">Categorías</button>
    <button onclick="openCategoryForm(selectedCategory)">Editar actual</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="title">
      <div class="eyebrow">Scene soundtrack</div>
      <h1 id="categoryTitle">Exploración</h1>
      <p id="categorySubtitle"></p>
    </div>
    <div class="top-actions">
      <button class="textbtn edit-only hidden" onclick="openLibrary()">Biblioteca</button>
      <button class="textbtn edit-only hidden" data-action="sync" onclick="syncToGitHub()">Sync</button>
      <button class="iconbtn" id="lockBtn" onclick="toggleEditMode()">🔒</button>
      <button class="iconbtn" onclick="openSettings()">⚙</button>
      <div class="sync-state"><span id="syncDot" class="sync-dot"></span><span id="syncText">Cargando...</span></div>
    </div>
  </div>

  <div class="searchbar">
    <input id="searchInput" placeholder="Buscar en esta escena..." oninput="renderTracks()">
    <select class="filter" id="intensityFilter" onchange="renderTracks()">
      <option value="">Todas</option><option>Calm</option><option>Soft</option><option>Warm</option><option>Medium</option><option>High</option><option>Epic</option><option>Boss</option>
    </select>
  </div>

  <div class="grid" id="tracks"></div>

  <details class="debug">
    <summary>Diagnóstico de YouTube</summary>
    <div class="players"><div class="playerbox"><div id="playerA"></div></div><div class="playerbox"><div id="playerB"></div></div></div>
  </details>
</main>
</div>

<div class="now">
  <div class="nowrow">
    <div class="np">
      <small>Now Playing</small>
      <strong id="nowTitle">Nada reproduciéndose</strong>
      <span id="nowMeta">Seleccione una pista</span>
      <button class="audio-chip" id="audioChip" onclick="ensureAudio()">Audio pendiente</button>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Inicializando YouTube…</span></div>
    </div>
    <div class="transport">
      <button onclick="pauseCurrent()">Ⅱ</button>
      <button class="primary" onclick="resumeCurrent()">▶</button>
      <button onclick="stopAll()">■</button>
    </div>
    <div class="master">
      <span>Volumen</span>
      <input id="masterVolume" type="range" min="0" max="100" value="72">
      <strong id="volumeLabel">72%</strong>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
const APP = {
  repoOwner:'luisparrapaniagua',
  repoName:'dndcompanion',
  branch:'main',
  libraryPath:'library.json'
};
const LS_DRAFT='dnd.v04.libraryDraft';
const LS_DIRTY='dnd.v04.dirty';
const LS_SETTINGS='dnd.v04.settings';
const LS_PINHASH='dnd.v04.pinHash';

let library={schemaVersion:1,revision:0,updatedAt:null,categories:[]};
let remoteLibrary=null, selectedCategory=null, currentTrack=null;
let players=[null,null], activeIndex=0, ytReady=false, readyCount=0, audioReady=false, transitionTimer=null;
let editMode=false;
let syncInProgress=false;
const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const $=id=>document.getElementById(id);
const settings=()=>JSON.parse(localStorage.getItem(LS_SETTINGS)||'{}');
const saveSettings=o=>localStorage.setItem(LS_SETTINGS,JSON.stringify({...settings(),...o}));
const uid=p=>(p||'id')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function setStatus(text,cls=''){$('statusText').textContent=text;$('statusDot').className='dot '+cls}
function setSync(text,cls=''){$('syncText').textContent=text;$('syncDot').className='sync-dot '+cls}

async function loadInitialLibrary(){
  setSync('Leyendo repositorio...');
  let remote=null;
  try{
    const r=await fetch('./library.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    remote=await r.json(); remoteLibrary=clone(remote);
  }catch(e){console.warn(e)}
  const draft=localStorage.getItem(LS_DRAFT);
  const dirty=localStorage.getItem(LS_DIRTY)==='1';
  if(draft && dirty){
    try{
      library=JSON.parse(draft);
      if(remote && (remote.revision||0)>(library.baseRevision??library.revision??0)){
        setSync('Cambios locales + repo nuevo','conflict');
      }else setSync('Cambios locales','dirty');
    }catch{library=remote||library}
  }else{
    library=remote|| (draft?JSON.parse(draft):library);
    if(remote){localStorage.setItem(LS_DRAFT,JSON.stringify(library));localStorage.setItem(LS_DIRTY,'0');setSync('Sincronizado','clean')}
    else setSync('Solo copia local','dirty');
  }
  normalizeLibrary();
  selectedCategory=library.categories[0]?.id||null;
  renderAll();
}
function normalizeLibrary(){
  library.categories=(library.categories||[]).map(c=>({...c,id:c.id||uid('cat'),icon:c.icon||'◆',tracks:(c.tracks||[]).map(t=>({...t,id:t.id||uid('tr'),favorite:!!t.favorite}))}));
}
function markDirty(){
  library.baseRevision=remoteLibrary?.revision ?? library.revision ?? 0;
  localStorage.setItem(LS_DRAFT,JSON.stringify(library));localStorage.setItem(LS_DIRTY,'1');setSync('Cambios locales','dirty');
}
function renderAll(){renderCategories();renderHeader();renderTracks();updateEditUI()}
function selectedCat(){return library.categories.find(c=>c.id===selectedCategory)||library.categories[0]}
function renderHeader(){
 const c=selectedCat(); if(!c)return;
 document.documentElement.style.setProperty('--cat-accent',c.accent||'#c69a52');
 $('categoryTitle').textContent=`${c.icon||'◆'} ${c.name}`;
 $('categorySubtitle').textContent=c.description||'';
}
function renderCategories(){
 $('categories').innerHTML=library.categories.map(c=>`<button class="category ${c.id===selectedCategory?'active':''}" data-id="${c.id}" style="${c.id===selectedCategory?`--cat-accent:${c.accent||'#c69a52'}`:''}"><span>${escapeHtml(c.icon||'◆')}</span><span>${escapeHtml(c.name)}</span><span class="count">${c.tracks?.length||0}</span></button>`).join('');
 document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.id;renderAll()});
}

function renderTracks(){
 const c=selectedCat(); if(!c){$('tracks').innerHTML='';return}
 const q=($('searchInput')?.value||'').toLowerCase(), f=$('intensityFilter')?.value||'';
 let tracks=(c.tracks||[]).filter(t=>(!q||`${t.title} ${t.author||''}`.toLowerCase().includes(q))&&(!f||t.intensity===f));
 if(!tracks.length){$('tracks').innerHTML='<div class="empty">No hay pistas para mostrar en esta escena.</div>';return}
 $('tracks').innerHTML=tracks.map(t=>{
   const playing=currentTrack?.id===t.id;
   return `<article class="track ${playing?'playing':''} ${t.favorite?'favorite':''}" data-id="${t.id}">
     <button class="seal" title="Favorito" data-fav="${t.id}" style="border:0;background:none;cursor:pointer">★</button>
     <div class="kicker">${escapeHtml(t.intensity||'Track')}</div>
     <h3>${escapeHtml(t.title||'Sin título')}</h3>
     <p>${escapeHtml(t.author||'YouTube')}</p>
     <div class="row"><button class="play">${playing?'SONANDO':'REPRODUCIR'}</button><a class="open" target="_blank" rel="noopener" href="https://music.youtube.com/watch?v=${encodeURIComponent(t.youtubeId)}">YouTube Music ↗</a></div>
   </article>`;
 }).join('');
 document.querySelectorAll('.track').forEach(card=>card.onclick=e=>{
   const fav=e.target.closest('[data-fav]'); if(fav){e.stopPropagation();toggleFavorite(fav.dataset.fav);return}
   if(e.target.closest('a'))return;
   const t=c.tracks.find(x=>x.id===card.dataset.id); if(t)playTrack(t,c);
 });
}
function toggleFavorite(id){const c=selectedCat(),t=c.tracks.find(x=>x.id===id);if(t){t.favorite=!t.favorite;markDirty();renderTracks()}}

function onYouTubeIframeAPIReady(){
 const origin=window.location.origin;
 const common={height:'200',width:'356',playerVars:{autoplay:0,controls:1,playsinline:1,rel:0,origin}};
 players[0]=new YT.Player('playerA',{...common,events:{onReady:onMainReady,onError:onPlayerError,onAutoplayBlocked:onAutoplayBlocked}});
 players[1]=new YT.Player('playerB',{...common,events:{onReady:onMainReady,onError:onPlayerError,onAutoplayBlocked:onAutoplayBlocked}});
}
function onMainReady(){readyCount++;if(readyCount===2){ytReady=true;setStatus('YouTube listo','ready')}}
function onPlayerError(e){const m={2:'ID inválido',5:'Error HTML5',100:'Video privado/eliminado',101:'Embed bloqueado',150:'Embed bloqueado',153:'Identificación de cliente'};setStatus(`YouTube ${e.data}: ${m[e.data]||'error'}`,'error')}
function onAutoplayBlocked(){setStatus('Safari bloqueó autoplay. Pulse Play en diagnóstico una vez.','error')}
async function ensureAudio(){
 if(!ytReady){setStatus('YouTube aún está cargando');return false}
 audioReady=true;$('audioChip').textContent='Audio activo';$('audioChip').classList.add('ready');setStatus('Audio habilitado','ready');return true
}
function setVol(p,v){try{p?.setVolume(Math.max(0,Math.min(100,Math.round(v))))}catch{}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function ramp(p,from,to,ms){if(ms<=0){setVol(p,to);return}const n=Math.max(1,Math.floor(ms/70));for(let i=0;i<=n;i++){let f=i/n;setVol(p,from+(to-from)*f);await wait(ms/n)}}
async function playTrack(track,category){
 if(!audioReady) await ensureAudio();
 if(!ytReady)return;
 if(transitionTimer){clearInterval(transitionTimer);transitionTimer=null}
 const master=+$('masterVolume').value,fadeMs=+(settings().fadeSeconds??4)*1000;
 currentTrack=track;$('nowTitle').textContent=track.title;$('nowMeta').textContent=`${category.name} · ${track.author||'YouTube'}`;renderTracks();
 if(isiOS){
   const p=players[activeIndex];setStatus('Transición iPad','fading');
   await ramp(p,master,0,fadeMs/2);try{p.loadVideoById(track.youtubeId);p.playVideo()}catch{};await wait(160);await ramp(p,0,master,fadeMs/2);setStatus('Reproduciendo','ready');return;
 }
 const oi=activeIndex,ni=1-activeIndex,old=players[oi],next=players[ni];setVol(next,0);try{next.loadVideoById(track.youtubeId);next.playVideo()}catch{};activeIndex=ni;
 if(fadeMs===0){try{old.stopVideo()}catch{}setVol(next,master);setStatus('Reproduciendo','ready');return}

async function fetchPlaylistItemsPage({playlistId,apiKey,pageToken=''}) {
 const params=new URLSearchParams({
   part:'snippet,contentDetails',
   playlistId,
   maxResults:'50',
   key:apiKey
 });
 if(pageToken)params.set('pageToken',pageToken);

 const r=await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?${params.toString()}`,{
   cache:'no-store'
 });
 const data=await r.json().catch(()=>null);
 if(!r.ok){
   const msg=data?.error?.message||`YouTube API ${r.status}`;
   const err=new Error(msg);
   err.status=r.status;
   err.payload=data;
   throw err;
 }
 return data;
}

async function fetchAllPlaylistItems({playlistId,apiKey,onProgress}) {
 const all=[];
 let pageToken='',page=0;
 do{
   page++;
   onProgress?.(`Leyendo playlist · página ${page}…`);
   const data=await fetchPlaylistItemsPage({playlistId,apiKey,pageToken});
   for(const item of (data.items||[])){
     const snippet=item.snippet||{};
     const videoId=item.contentDetails?.videoId||snippet.resourceId?.videoId||'';
     all.push({
       videoId,
       title:snippet.title||'',
       author:snippet.videoOwnerChannelTitle||snippet.channelTitle||'YouTube',
       position:Number.isFinite(snippet.position)?snippet.position:all.length,
       availabilityTitle:snippet.title||''
     });
   }
   pageToken=data.nextPageToken||'';
 }while(pageToken);
 return all.sort((a,b)=>a.position-b.position);
}

function isUnavailablePlaylistItem(item){
 if(!item.videoId)return true;
 const t=(item.title||'').trim().toLowerCase();
 return !t || t==='deleted video' || t==='private video';
}

async function beginPlaylistImport(){
 const s=settings();
 const apiKey=(s.youtubeApiKey||'').trim();
 if(!apiKey){
   alert('Configure primero la YouTube Data API key en ⚙.');
   openSettings();
   return;
 }

 const pid=extractPlaylistId($('playlistUrl').value);
 const catId=$('playlistCat').value;
 const intensity=$('playlistIntensity').value;
 if(!pid)return alert('Ingrese una playlist.');

 const progress=$('importProgress');
 const btn=$('importPlaylistBtn');
 btn.disabled=true;
 btn.textContent='Importando...';

 try{
   const items=await fetchAllPlaylistItems({
     playlistId:pid,
     apiKey,
     onProgress:t=>progress.textContent=t
   });

   const dest=library.categories.find(c=>c.id===catId);
   if(!dest)throw new Error('Categoría destino no encontrada.');

   const existing=new Set(dest.tracks.map(t=>t.youtubeId));
   let added=0,duplicates=0,unavailable=0;

   for(let i=0;i<items.length;i++){
     const item=items[i];
     progress.textContent=`Procesando ${i+1} de ${items.length}…`;

     if(isUnavailablePlaylistItem(item)){
       unavailable++;
       continue;
     }
     if(existing.has(item.videoId)){
       duplicates++;
       continue;
     }

     dest.tracks.push({
       id:uid('tr'),
       title:item.title,
       author:item.author||'YouTube',
       youtubeId:item.videoId,
       intensity,
       favorite:false
     });
     existing.add(item.videoId);
     added++;
   }

   if(added>0){
     markDirty();
     selectedCategory=catId;
     renderAll();
   }

   progress.textContent=`Listo: ${added} importadas · ${duplicates} duplicadas · ${unavailable} no disponibles.`;

   setTimeout(()=>{
     closeModal();
     openCategoryForm(catId);
   },1100);

 }catch(e){
   console.error(e);
   progress.textContent='No se pudo importar: '+e.message;
 }finally{
   btn.disabled=false;
   btn.textContent='Importar';
 }
}

function b64Utf8(str){const bytes=new TextEncoder().encode(str);let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
async function fetchGitHubLibraryState({owner,repo,branch,path,token}){
 const headers={
   'Accept':'application/vnd.github+json',
   'Authorization':`Bearer ${token}`,
   'X-GitHub-Api-Version':'2022-11-28'
 };
 const get=await fetch(
   `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path}?ref=${encodeURIComponent(branch)}`,
   {headers,cache:'no-store'}
 );
 if(get.status===404){
   return {headers,sha:null,remote:null};
 }
 if(!get.ok){
   let tx=await get.text();
   throw new Error(`GitHub GET ${get.status}: ${tx.slice(0,180)}`);
 }
 const info=await get.json();
 let remote=null;
 try{
   const raw=await fetch(info.download_url+'?ts='+Date.now(),{cache:'no-store'});
   if(raw.ok)remote=await raw.json();
 }catch(e){
   console.warn('Could not parse remote library.json metadata.',e);
 }
 return {headers,sha:info.sha||null,remote};
}

async function writeLibraryToGitHub({
 owner,
 repo,
 branch,
 path,
 token,
 libraryToWrite,
 retry=true
}){
 const state=await fetchGitHubLibraryState({owner,repo,branch,path,token});
 const {headers,sha,remote}=state;

 const base=libraryToWrite.baseRevision
   ?? remoteLibrary?.revision
   ?? libraryToWrite.revision
   ?? 0;

 if(remote && (remote.revision||0)>base){
   setSync('Conflicto con GitHub','conflict');
   const overwrite=confirm(
     `GitHub tiene revisión ${remote.revision} y sus cambios parten de ${base}. ¿Sobrescribir de todos modos?`
   );
   if(!overwrite){
     const err=new Error('Sincronización cancelada por conflicto de revisión.');
     err.code='REVISION_CONFLICT_CANCELLED';
     throw err;
   }
 }

 const next=clone(libraryToWrite);
 delete next.baseRevision;
 next.revision=Math.max(remote?.revision||0,libraryToWrite.revision||0)+1;
 next.updatedAt=new Date().toISOString();

 const body={
   message:`Update music library r${next.revision}`,
   content:b64Utf8(JSON.stringify(next,null,2)),
   branch
 };
 if(sha)body.sha=sha;

 const put=await fetch(
   `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path}`,
   {
     method:'PUT',
     headers:{...headers,'Content-Type':'application/json'},
     body:JSON.stringify(body)
   }
 );

 if(put.status===409 && retry){
   console.warn('GitHub SHA conflict. Reloading SHA and retrying once.');
   return writeLibraryToGitHub({
     owner,
     repo,
     branch,
     path,
     token,
     libraryToWrite,
     retry:false
   });
 }

 if(!put.ok){
   let tx=await put.text();
   throw new Error(`GitHub PUT ${put.status}: ${tx.slice(0,180)}`);
 }

 return {
   library:next,
   response:await put.json().catch(()=>null)
 };
}

async function syncToGitHub(){
 if(syncInProgress){
   return;
 }
 if(!editMode){
   return toggleEditMode();
 }

 const s=settings(),token=s.token;
 if(!token){
   alert('Configure primero el token de GitHub en ⚙.');
   openSettings();
   return;
 }

 syncInProgress=true;
 const syncButtons=document.querySelectorAll('[data-action="sync"]');
 syncButtons.forEach(b=>{
   b.disabled=true;
   b.dataset.originalText=b.textContent;
   b.textContent='Sincronizando...';
 });

 setSync('Sincronizando...');

 try{
   const owner=s.owner||APP.repoOwner;
   const repo=s.repo||APP.repoName;
   const branch=s.branch||APP.branch;
   const path=APP.libraryPath;

   const result=await writeLibraryToGitHub({
     owner,
     repo,
     branch,
     path,
     token,
     libraryToWrite:clone(library),
     retry:true
   });

   // Only a real successful GitHub PUT may clear the local dirty state.
   library=result.library;
   remoteLibrary=clone(result.library);
   localStorage.setItem(LS_DRAFT,JSON.stringify(result.library));
   localStorage.setItem(LS_DIRTY,'0');
   setSync(`Sync r${result.library.revision}`,'clean');
   renderAll();

 }catch(e){
   console.error(e);

   // Never discard local edits or clear dirty on any failed/cancelled sync.
   localStorage.setItem(LS_DRAFT,JSON.stringify(library));
   localStorage.setItem(LS_DIRTY,'1');

   if(e.code==='REVISION_CONFLICT_CANCELLED'){
     setSync('Cambios locales sin sincronizar','dirty');
   }else{
     setSync('Error de sync','conflict');
     alert('No se pudo sincronizar: '+e.message);
   }

 }finally{
   syncInProgress=false;
   syncButtons.forEach(b=>{
     b.disabled=false;
     b.textContent=b.dataset.originalText||'Sync';
     delete b.dataset.originalText;
   });
 }
}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
